<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="doc-title">Blog — Sean-fhaclan & Auld Sayins</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#5b2a86" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root {
    --saltire: #0065bd; --thistle: #5b2a86; --amber: #a3691f; --heather: #8e6c9c;
    --parchment: #faf6ee; --ink: #2b2320;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--parchment); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .proverb-text { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }

  header.app-header { background: linear-gradient(to right, var(--saltire), var(--thistle)); color: #fff; padding: 32px 20px; }
  header.app-header .inner { max-width: 700px; margin: 0 auto; position: relative; }
  header.app-header h1 { margin: 0; font-size: 1.9rem; }

  .ui-lang-toggle { display: inline-flex; flex: 0 0 auto; background: rgba(255,255,255,0.15); border-radius: 999px; padding: 3px; }
  .ui-lang-toggle button { border: none; background: transparent; color: rgba(255,255,255,0.85); padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
  .ui-lang-toggle button.active { background: #fff; color: var(--thistle); }

  .header-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .site-nav {
    display: flex; gap: 4px; flex: 1 1 auto; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .site-nav::-webkit-scrollbar { display: none; }
  .site-nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); }
  .site-nav a:hover { background: rgba(255,255,255,0.12); }
  .site-nav a.active { background: #fff; color: var(--thistle); border-color: #fff; }
  .nav-dropdown { position: relative; flex: 0 0 auto; }
  .nav-dropdown-toggle { font-family: inherit; color: rgba(255,255,255,0.8); background: transparent; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .nav-dropdown-toggle:hover { background: rgba(255,255,255,0.12); }
  .nav-dropdown.open .nav-dropdown-toggle, .nav-dropdown-toggle.active { background: #fff; color: var(--thistle); border-color: #fff; }
  .nav-caret { font-size: 0.6rem; }
  .nav-dropdown-menu { display: none; position: fixed; z-index: 200; background: #fff; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.18); padding: 6px; min-width: 190px; }
  .nav-dropdown.open .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a { display: block; padding: 8px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
  .nav-dropdown-menu a:hover { background: rgba(142,108,156,0.1); }
  .nav-dropdown-menu a.active { color: var(--thistle); }
  @media (max-width: 700px) {
    .nav-dropdown-menu { position: static !important; box-shadow: none; margin-top: 4px; width: 100%; }
  }

  main { max-width: 700px; margin: 0 auto; padding: 24px 20px 60px; }

  .card { background: #fff; border-radius: 12px; border: 1px solid rgba(142,108,156,0.2); box-shadow: 0 1px 2px rgba(0,0,0,0.04); padding: 26px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
  .card p { line-height: 1.6; color: rgba(43,35,32,0.8); margin: 0 0 12px; }
  .card p:last-child { margin-bottom: 0; }

  .btn-outline { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(142,108,156,0.3); background: #fff; font-size: 0.85rem; color: var(--thistle); cursor: pointer; font-weight: 600; }
  .btn-outline:hover { background: rgba(91,42,134,0.05); }

  .app-footer { text-align: center; font-size: 0.75rem; color: rgba(43,35,32,0.4); padding: 32px 0; }

  .blog-toprow { display: flex; align-items: center; justify-content: flex-end; margin: 0 0 14px; }
  .write-post-link { font-size: 0.8rem; font-weight: 600; color: var(--thistle); text-decoration: none; opacity: 0.75; display: inline-flex; align-items: center; gap: 4px; }
  .write-post-link:hover { text-decoration: underline; opacity: 1; }

  /* Continuous Substack-style post feed (no filter/section pills) */
  .post-card { cursor: pointer; padding: 0; overflow: hidden; }
  .post-card:hover { border-color: rgba(142,108,156,0.4); }
  .tweet-media { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: linear-gradient(135deg, var(--thistle), var(--saltire)); display: flex; align-items: center; justify-content: center; }
  .tweet-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tweet-media-fallback { color: rgba(255,255,255,0.92); font-family: Georgia, 'Iowan Old Style', serif; font-style: italic; font-size: 1.05rem; line-height: 1.5; padding: 26px 30px; text-align: center; }
  .tweet-body { padding: 20px 22px 22px; }
  .post-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.75rem; flex-wrap: wrap; }
  .post-date { color: rgba(43,35,32,0.5); }
  .post-tags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .post-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.01em; background: rgba(91,42,134,0.08); color: var(--thistle); }
  .post-card h2 { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
  .post-excerpt { line-height: 1.6; color: rgba(43,35,32,0.8); margin: 0 0 14px; }
  .post-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .read-more { font-size: 0.85rem; font-weight: 600; color: var(--thistle); }

  .like-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(142,108,156,0.3); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 0.82rem; font-weight: 700; color: var(--heather); cursor: pointer; line-height: 1; transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
  .like-btn:hover { border-color: rgba(179,38,30,0.35); }
  .like-btn .like-icon { font-size: 1rem; }
  .like-btn.liked { background: rgba(179,38,30,0.06); border-color: rgba(179,38,30,0.35); color: #b3261e; }
  .like-btn.liked .like-icon { color: #b3261e; }
  .like-btn.just-liked { animation: like-pop 0.35s ease; }
  @keyframes like-pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .post-detail .like-btn { margin: 4px 0 18px; }

  .post-detail h2 { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; font-size: 1.5rem; }
  .post-detail .post-body p { line-height: 1.75; color: rgba(43,35,32,0.88); margin: 0 0 16px; }
  .post-detail .post-body p:last-child { margin-bottom: 0; }
  .post-detail-image { width: 100%; border-radius: 10px; margin: 0 0 18px; display: block; }
  .back-link { display: inline-block; margin-bottom: 18px; font-size: 0.85rem; font-weight: 600; color: var(--thistle); text-decoration: none; }
  .back-link:hover { text-decoration: underline; }

  .empty-state { text-align: center; color: rgba(43,35,32,0.5); padding: 40px 0; }
</style>
</head>

<script>
document.querySelectorAll('.nav-dropdown-toggle').forEach(function (btn) {
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var dd = btn.closest('.nav-dropdown');
    var menu = dd.querySelector('.nav-dropdown-menu');
    var wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    if (!wasOpen) {
      var r = btn.getBoundingClientRect();
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = r.left + 'px';
      dd.classList.add('open');
    }
  });
});
document.addEventListener('click', function () {
  document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
});
window.addEventListener('scroll', function (e) {
  if (e.target !== document) return;
  document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
}, true);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://kgbmdazcupgyypfvvqbv.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_wU4B6n7leK-r1kcrhuOzJw_pUAkC4Mm';
  var sfClient = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  var I18N = {
    docTitle: { en: 'Blog — Sean-fhaclan & Auld Sayins', gd: 'Bloga — Sean-fhaclan & Auld Sayins' },
    pageTitle: { en: 'Blog', gd: 'Bloga' },
    footer: { en: 'Sean-fhaclan & Auld Sayins', gd: 'Sean-fhaclan & Auld Sayins' },
    navHome: { en: 'Home', gd: 'Dachaigh' },
    navMyAccount: { en: 'My Account', gd: 'An Cunntas Agam' },
    navGrammar: { en: 'Grammar', gd: 'Gràmar' },
    navGaelicCollection: { en: 'Gaelic Collection', gd: 'Cruinneachadh Gàidhlig' },
    navScotsCollection: { en: 'Scots Collection', gd: 'Cruinneachadh Beurla Ghallda' },
    navGames: { en: 'Games', gd: 'Geamannan' },
    navResources: { en: 'Resources', gd: 'Goireasan' },
    navBlog: { en: 'Blog', gd: 'Bloga' },
    navAbout: { en: 'About', gd: 'Mun Dèidhinn' },
    writePost: { en: '✎ Write a post', gd: '✎ Sgrìobh post' },
    readMore: { en: 'Read more →', gd: 'Leugh tuilleadh →' },
    backToBlog: { en: '← Back to all posts', gd: '← Air ais gu na puist uile' },
    emptyState: { en: 'No posts yet — check back soon.', gd: "Chan eil post sam bith fhathast — thig air ais a dh'aithghearr." },
    loading: { en: 'Loading posts…', gd: 'A’ luchdachadh nam post…' },
    loadError: { en: 'Could not load posts right now — try refreshing the page.', gd: 'Cha b’ urrainn na puist a luchdachadh an-dràsta — feuch an duilleag ath-luchdachadh.' }
  };

  var el = {
    docTitle: document.getElementById('doc-title'),
    pageTitle: document.getElementById('page-title'),
    footer: document.getElementById('footer-text'),
    navHome: document.getElementById('nav-home'),
    navMyAccount: document.getElementById('nav-my-account'),
    navGrammar: document.getElementById('nav-grammar'),
    navGaelicCollection: document.getElementById('nav-gaelic-collection'),
    navScotsCollection: document.getElementById('nav-scots-collection'),
    navGames: document.getElementById('nav-games'),
    navResources: document.getElementById('nav-resources'),
    navBlog: document.getElementById('nav-blog'),
    navAbout: document.getElementById('nav-about'),
    uiLangEn: document.getElementById('ui-lang-en'),
    uiLangGd: document.getElementById('ui-lang-gd'),
    writePostLink: document.getElementById('write-post-link'),
    blogListView: document.getElementById('blog-list-view'),
    blogList: document.getElementById('blog-list'),
    blogDetail: document.getElementById('blog-detail')
  };

  var POSTS = [];
  var postsLoaded = false;
  var state = { lang: 'en' };

  function loadJSON(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // Likes are a simple one-way "heart" — once a slug is in this list on this
  // browser, the heart shows filled and clicking again does nothing. There's
  // no login involved, so it's tracked per-browser via localStorage rather
  // than per-account; good enough to stop casual repeat-clicking.
  var likedSlugs = loadJSON('sf-liked-posts', []);
  function isLiked(slug) { return likedSlugs.indexOf(slug) !== -1; }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONTHS_GD = ['Am Faoilleach','An Gearran','Am Màrt','An Giblean','An Cèitean','An t-Ògmhios','An t-Iuchar','An Dønastal','An t-Sultain','An Dàmhair','An t-Samhain','An Dùbhlachd'];

  function fmtDate(iso, lang) {
    var d = new Date(iso + 'T00:00:00');
    var months = lang === 'gd' ? MONTHS_GD : MONTHS_EN;
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function tagPillsHtml(tags) {
    return (tags || []).map(function (tg) {
      return '<span class="post-tag">' + escapeHtml(tg) + '</span>';
    }).join('');
  }

  function likeBtnHtml(slug, likes) {
    var liked = isLiked(slug);
    return '<button type="button" class="like-btn' + (liked ? ' liked' : '') + '" data-slug="' + escapeHtml(slug) + '" aria-pressed="' + (liked ? 'true' : 'false') + '">' +
      '<span class="like-icon">' + (liked ? '♥' : '♡') + '</span>' +
      '<span class="like-count">' + (likes || 0) + '</span>' +
    '</button>';
  }

  function sortedPosts() {
    return POSTS.slice().sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  }

  // Short pull-quote used as a fallback "cover image" for posts with no
  // image_url set — keeps every card the same shape either way.
  function fallbackQuote(excerpt) {
    var words = String(excerpt || '').split(/\s+/).slice(0, 16).join(' ');
    return '“' + words + (words.length < String(excerpt || '').length ? '…' : '') + '”';
  }

  function bindLikeButtons(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.like-btn'), function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        handleLike(btn.getAttribute('data-slug'), btn);
      });
    });
  }

  function handleLike(slug, btn) {
    if (isLiked(slug)) return;
    likedSlugs.push(slug);
    saveJSON('sf-liked-posts', likedSlugs);

    var post = POSTS.filter(function (p) { return p.slug === slug; })[0];
    if (post) post.likes = (post.likes || 0) + 1;

    // Optimistic UI update across every like button for this post (list +
    // detail can both be rendered at once in the DOM, just hidden/shown).
    Array.prototype.forEach.call(document.querySelectorAll('.like-btn[data-slug="' + slug.replace(/"/g, '') + '"]'), function (b) {
      b.classList.add('liked', 'just-liked');
      b.setAttribute('aria-pressed', 'true');
      b.querySelector('.like-icon').textContent = '♥';
      b.querySelector('.like-count').textContent = String(post ? post.likes : (parseInt(b.querySelector('.like-count').textContent, 10) || 0) + 1);
    });

    if (sfClient) {
      sfClient.rpc('increment_post_likes', { post_slug: slug }).then(function (res) {
        if (res.error) return; // keep the optimistic UI either way — not worth reverting a heart tap
        if (typeof res.data === 'number' && post) post.likes = res.data;
      });
    }
  }

  function renderList() {
    if (!postsLoaded) {
      el.blogList.innerHTML = '<p class="empty-state">' + I18N.loading[state.lang] + '</p>';
      return;
    }
    var all = sortedPosts();
    if (!all.length) {
      el.blogList.innerHTML = '<p class="empty-state">' + I18N.emptyState[state.lang] + '</p>';
      return;
    }
    el.blogList.innerHTML = all.map(function (p) {
      var media = p.image
        ? '<img src="' + escapeHtml(p.image) + '" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;tweet-media-fallback&quot;&gt;' + escapeHtml(fallbackQuote(p.excerpt[state.lang])).replace(/'/g, '&#39;') + '&lt;/div&gt;\'" />'
        : '<div class="tweet-media-fallback">' + escapeHtml(fallbackQuote(p.excerpt[state.lang])) + '</div>';
      return '<div class="card post-card" data-slug="' + p.slug + '">' +
        '<div class="tweet-media">' + media + '</div>' +
        '<div class="tweet-body">' +
        '<div class="post-meta"><span class="post-date">' + fmtDate(p.date, state.lang) + '</span>' +
        '<span class="post-tags">' + tagPillsHtml(p.tags) + '</span></div>' +
        '<h2>' + escapeHtml(p.title[state.lang]) + '</h2>' +
        '<p class="post-excerpt">' + escapeHtml(p.excerpt[state.lang]) + '</p>' +
        '<div class="post-card-footer">' +
        '<span class="read-more">' + I18N.readMore[state.lang] + '</span>' +
        likeBtnHtml(p.slug, p.likes) +
        '</div>' +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(el.blogList.querySelectorAll('.post-card'), function (card) {
      card.addEventListener('click', function () {
        location.hash = 'post=' + card.getAttribute('data-slug');
      });
    });
    bindLikeButtons(el.blogList);
  }

  function renderDetail(slug) {
    if (!postsLoaded) {
      el.blogDetail.innerHTML = '<p class="empty-state">' + I18N.loading[state.lang] + '</p>';
      return;
    }
    var matches = POSTS.filter(function (p) { return p.slug === slug; });
    var post = matches.length ? matches[0] : null;
    if (!post) { location.hash = ''; return; }
    var paragraphs = post.body[state.lang].split('\n\n');
    var bodyHtml = paragraphs.map(function (para) { return '<p>' + escapeHtml(para) + '</p>'; }).join('');
    var imageHtml = post.image ? '<img class="post-detail-image" src="' + escapeHtml(post.image) + '" alt="" />' : '';
    el.blogDetail.innerHTML =
      '<a href="#" class="back-link" id="back-link">' + I18N.backToBlog[state.lang] + '</a>' +
      '<div class="card post-detail">' +
        imageHtml +
        '<div class="post-meta"><span class="post-date">' + fmtDate(post.date, state.lang) + '</span>' +
        '<span class="post-tags">' + tagPillsHtml(post.tags) + '</span></div>' +
        '<h2>' + escapeHtml(post.title[state.lang]) + '</h2>' +
        likeBtnHtml(post.slug, post.likes) +
        '<div class="post-body">' + bodyHtml + '</div>' +
      '</div>';
    document.getElementById('back-link').addEventListener('click', function (e) {
      e.preventDefault();
      location.hash = '';
    });
    bindLikeButtons(el.blogDetail);
  }

  function route() {
    var hash = location.hash.replace('#', '');
    if (hash.indexOf('post=') === 0) {
      el.blogListView.style.display = 'none';
      el.blogDetail.style.display = 'block';
      renderDetail(decodeURIComponent(hash.slice(5)));
    } else {
      el.blogDetail.style.display = 'none';
      el.blogListView.style.display = 'block';
      renderList();
    }
  }

  window.addEventListener('hashchange', route);

  function loadPosts() {
    if (!sfClient) {
      el.blogList.innerHTML = '<p class="empty-state">' + I18N.loadError[state.lang] + '</p>';
      return;
    }
    sfClient.from('blog_posts').select('*').order('published_at', { ascending: false }).then(function (res) {
      if (res.error || !res.data) {
        el.blogList.innerHTML = '<p class="empty-state">' + I18N.loadError[state.lang] + '</p>';
        return;
      }
      POSTS = res.data.map(function (row) {
        return {
          slug: row.slug,
          date: row.published_at,
          tags: row.tags || [],
          image: row.image_url || null,
          likes: row.likes || 0,
          title: { en: row.title_en, gd: row.title_gd || row.title_en },
          excerpt: { en: row.excerpt_en, gd: row.excerpt_gd || row.excerpt_en },
          body: { en: row.body_en, gd: row.body_gd || row.body_en }
        };
      });
      postsLoaded = true;
      route();
    });
  }

  function applyChrome(lang) {
    state.lang = lang;
    el.docTitle.textContent = I18N.docTitle[lang];
    el.pageTitle.textContent = I18N.pageTitle[lang];
    el.footer.textContent = I18N.footer[lang];
    el.navHome.textContent = I18N.navHome[lang];
    el.navMyAccount.textContent = I18N.navMyAccount[lang];
    el.navGrammar.textContent = I18N.navGrammar[lang];
    el.navGaelicCollection.textContent = I18N.navGaelicCollection[lang];
    el.navScotsCollection.textContent = I18N.navScotsCollection[lang];
    el.navGames.textContent = I18N.navGames[lang];
    el.navResources.textContent = I18N.navResources[lang];
    el.navBlog.textContent = I18N.navBlog[lang];
    el.navAbout.textContent = I18N.navAbout[lang];
    el.writePostLink.textContent = I18N.writePost[lang];
    route();
  }

  function setUiLang(lang) {
    saveJSON('sf-ui-lang', lang);
    el.uiLangEn.classList.toggle('active', lang === 'en');
    el.uiLangGd.classList.toggle('active', lang === 'gd');
    applyChrome(lang);
  }

  el.uiLangEn.addEventListener('click', function () { setUiLang('en'); });
  el.uiLangGd.addEventListener('click', function () { setUiLang('gd'); });

  var savedUiLang = loadJSON('sf-ui-lang', 'en');
  setUiLang(savedUiLang === 'gd' ? 'gd' : 'en');
  loadPosts();
})();
</script>

</body>
</html>
