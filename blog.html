<script>
document.querySelectorAll('.nav-dropdown-toggle').forEach(function (btn) {
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var dd = btn.closest('.nav-dropdown');
    var menu = dd.querySelector('.nav-dropdown-menu');
    var wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    if (!wasOpen) {
      var r = btn.getBoundingClientRect();
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = r.left + 'px';
      dd.classList.add('open');
    }
  });
});
document.addEventListener('click', function () {
  document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
});
window.addEventListener('scroll', function (e) {
  if (e.target !== document) return;
  document.querySelectorAll('.nav-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
}, true);
</script>

    "body": {
      "en": "If you've started learning Gaelic, you've probably already noticed something odd: there isn't one word for 'is'. There are two — tha and is — and they're not interchangeable.\n\nTha is the verb you'll use constantly. It covers states, descriptions, feelings, locations — anything temporary or changeable. Tha mi sgìth (I am tired). Tha an cù anns a' ghàrradh (The dog is in the garden). Tha i brèagha an-diugh (It's lovely today).\n\nIs is different. It's used for identity and classification — saying what something fundamentally is, not how it currently is. Is mise Iain (I am Iain). Is tidsear i (She's a teacher). Is Albannach mi (I'm Scottish).\n\nA rough shortcut that helped me: if you could put 'right now' in front of the English sentence and it still makes sense, reach for tha. If you're stating a fact about identity, category, or permanent truth, reach for is.\n\nIt won't click after one read — it didn't for me either. The fastest way to build the instinct is repetition in context, which is exactly what today's word in Am Facal is for. Play a few rounds and start noticing which verb the example sentences use.",

    "body": {
      "en": "Sean-fhaclan & Auld Sayins started as a small side project — a list of proverbs I liked, in two languages that don't always get put side by side. Scots and Gaelic have very different reputations in Scotland, but they're both genuinely ours, and I wanted a place that treated them that way: equally, without ranking one above the other.\n\nIt grew from there. Proverbs turned into a grammar section, then a couple of daily word games, then accounts so people could save favourites and suggest ones I'd missed. None of it was planned out in advance — it's grown in evenings and weekends, a bit at a time, mostly based on what people actually asked for.\n\nI believe learning resources should be free, accessible, and fun. That's really the whole guiding idea behind everything here — the proverbs, the games, this blog. If something on the site could be better, or you've got a proverb, word, or idea I should add, the suggestion box in My Account goes straight to me.\n\nThanks for being here, and for helping keep both languages alive a little longer.",

  }

  function renderList() {
    var filtered = sortedPosts().filter(function (p) { return state.filter === 'all' || p.category === state.filter; });
    if (!filtered.length) {
      el.blogList.innerHTML = '<p class="empty-state">' + I18N.emptyState[state.lang] + '</p>';
      return;
    }
    el.blogList.innerHTML = filtered.map(function (p) {
      return '<div class="card post-card" data-slug="' + p.slug + '">' +
        '<div class="post-meta"><span class="post-badge ' + p.category + '">' + badgeLabel(p.category) + '</span>' +
        '<span class="post-date">' + fmtDate(p.date, state.lang) + '</span></div>' +
        '<h2>' + escapeHtml(p.title[state.lang]) + '</h2>' +
        '<p class="post-excerpt">' + escapeHtml(p.excerpt[state.lang]) + '</p>' +
        '<span class="read-more">' + I18N.readMore[state.lang] + '</span>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(el.blogList.querySelectorAll('.post-card'), function (card) {
      card.addEventListener('click', function () {
        location.hash = 'post=' + card.getAttribute('data-slug');
      });
    });
  }

  function renderDetail(slug) {
    var matches = POSTS.filter(function (p) { return p.slug === slug; });
    var post = matches.length ? matches[0] : null;
    if (!post) { location.hash = ''; return; }
    var paragraphs = post.body[state.lang].split('\n\n');
    var bodyHtml = paragraphs.map(function (para) { return '<p>' + escapeHtml(para) + '</p>'; }).join('');
    el.blogDetail.innerHTML =
      '<a href="#" class="back-link" id="back-link">' + I18N.backToBlog[state.lang] + '</a>' +
      '<div class="card post-detail">' +
        '<div class="post-meta"><span class="post-badge ' + post.category + '">' + badgeLabel(post.category) + '</span>' +
        '<span class="post-date">' + fmtDate(post.date, state.lang) + '</span></div>' +
        '<h2>' + escapeHtml(post.title[state.lang]) + '</h2>' +
        '<div class="post-body">' + bodyHtml + '</div>' +
      '</div>';
    document.getElementById('back-link').addEventListener('click', function (e) {
      e.preventDefault();
      location.hash = '';
    });
  }

  function route() {
    var hash = location.hash.replace('#', '');
    if (hash.indexOf('post=') === 0) {
      el.blogListView.style.display = 'none';
      el.blogDetail.style.display = 'block';
      renderDetail(decodeURIComponent(hash.slice(5)));
    } else {
      el.blogDetail.style.display = 'none';
      el.blogListView.style.display = 'block';
      renderList();
    }
  }

  window.addEventListener('hashchange', route);

  function applyChrome(lang) {
    state.lang = lang;
    el.docTitle.textContent = I18N.docTitle[lang];
    el.pageTitle.textContent = I18N.pageTitle[lang];
    el.footer.textContent = I18N.footer[lang];
    el.navHome.textContent = I18N.navHome[lang];
    el.navMyAccount.textContent = I18N.navMyAccount[lang];
    el.navGrammar.textContent = I18N.navGrammar[lang];
    el.navGaelicCollection.textContent = I18N.navGaelicCollection[lang];
    el.navScotsCollection.textContent = I18N.navScotsCollection[lang];
    el.navGames.textContent = I18N.navGames[lang];
    el.navResources.textContent = I18N.navResources[lang];
    el.navBlog.textContent = I18N.navBlog[lang];
    el.navAbout.textContent = I18N.navAbout[lang];
    renderFilters();
    route();
  }

  function setUiLang(lang) {
    saveJSON('sf-ui-lang', lang);
    el.uiLangEn.classList.toggle('active', lang === 'en');
    el.uiLangGd.classList.toggle('active', lang === 'gd');
    applyChrome(lang);
  }

  el.uiLangEn.addEventListener('click', function () { setUiLang('en'); });
  el.uiLangGd.addEventListener('click', function () { setUiLang('gd'); });

  var savedUiLang = loadJSON('sf-ui-lang', 'en');
  setUiLang(savedUiLang === 'gd' ? 'gd' : 'en');
})();
</script>

</body>
</html>
