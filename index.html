<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const DATA = JSON.parse(document.getElementById('proverb-data').textContent);

function normalise(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

function HeartIcon({ filled }) {
  return (
    <svg viewBox="0 0 24 24" width="18" height="18" fill={filled ? '#5b2a86' : 'none'} stroke="#5b2a86" strokeWidth="1.8">
      <path d="M12 21s-7.2-4.5-9.6-9.1C.7 8.6 2.1 5 5.6 4.2 8 3.6 10 4.7 12 7.2c2-2.5 4-3.6 6.4-3 3.5.8 4.9 4.4 3.2 7.7C19.2 16.5 12 21 12 21z"/>
    </svg>
  );
}

function DiceIcon() {
  return (
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
  );
}

function ProverbCard({ entry, direction, favourites, toggleFavourite }) {
  const isFav = favourites.includes(entry.id);
  const showScotsFirst = direction === 'scots-gaelic';
  const primary = showScotsFirst ? entry.scots : entry.gaelic;
  const secondary = showScotsFirst ? entry.gaelic : entry.scots;
  const primaryLabel = showScotsFirst ? 'Scots' : 'Gàidhlig';
  const secondaryLabel = showScotsFirst ? 'Gàidhlig' : 'Scots';

  return (
    <div className="bg-white rounded-xl border border-heather/20 shadow-sm p-5 flex flex-col gap-3">
      <div className="flex items-start justify-between gap-3">
        <span className="text-xs uppercase tracking-wide text-heather font-semibold">{entry.theme}</span>
        <button onClick={() => toggleFavourite(entry.id)} aria-label="Toggle favourite" className="shrink-0">
          <HeartIcon filled={isFav} />
        </button>
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide text-saltire font-semibold mb-1">{primaryLabel}</div>
        <p className="proverb-text text-lg text-ink leading-snug">{primary.text}</p>
        <p className="text-sm text-ink/60 mt-1">{primary.gloss}</p>
      </div>

      {secondary ? (
        <div className="border-t border-heather/15 pt-3">
          <div className="text-xs uppercase tracking-wide text-thistle font-semibold mb-1">{secondaryLabel} equivalent</div>
          <p className="proverb-text text-lg text-ink leading-snug">{secondary.text}</p>
          <p className="text-sm text-ink/60 mt-1">{secondary.gloss}</p>
        </div>
      ) : (
        <div className="border-t border-heather/15 pt-3">
          <p className="text-sm italic text-ink/50">No {secondaryLabel} equivalent recorded yet — know one? Suggest it below.</p>
        </div>
      )}

      <p className="text-xs text-ink/40 mt-1">{entry.source}</p>
    </div>
  );
}

function App() {
  const [direction, setDirection] = useState('scots-gaelic'); // or 'gaelic-scots'
  const [query, setQuery] = useState('');
  const [theme, setTheme] = useState('All');
  const [onlyFavourites, setOnlyFavourites] = useState(false);
  const [onlyLinked, setOnlyLinked] = useState(false);
  const [favourites, setFavourites] = useLocalStorage('sf-favourites', []);
  const [suggestions, setSuggestions] = useLocalStorage('sf-suggestions', []);
  const [showContribute, setShowContribute] = useState(false);
  const [showAbout, setShowAbout] = useState(false);
  const [toast, setToast] = useState('');

  const themes = useMemo(() => {
    const set = new Set(DATA.map(d => d.theme));
    return ['All', ...Array.from(set).sort()];
  }, []);

  const toggleFavourite = (id) => {
    setFavourites(favs => favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id]);
  };

  const filtered = useMemo(() => {
    const q = normalise(query);
    return DATA.filter(entry => {
      const langField = direction === 'scots-gaelic' ? entry.scots : entry.gaelic;
      if (!langField) return false; // must exist in the "from" language for this direction
      if (theme !== 'All' && entry.theme !== theme) return false;
      if (onlyFavourites && !favourites.includes(entry.id)) return false;
      if (onlyLinked && !entry.linked) return false;
      if (!q) return true;
      const hay = normalise(langField.text + ' ' + langField.gloss);
      return hay.includes(q);
    });
  }, [query, theme, direction, onlyFavourites, onlyLinked, favourites]);

  const randomProverb = () => {
    const pool = DATA.filter(e => direction === 'scots-gaelic' ? e.scots : e.gaelic);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setQuery('');
    setTheme('All');
    setOnlyFavourites(false);
    setOnlyLinked(false);
    setTimeout(() => {
      const el = document.getElementById('card-' + pick.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  };

  const handleContribute = (e) => {
    e.preventDefault();
    const form = e.target;
    const entry = {
      id: 'draft-' + Date.now(),
      scotsText: form.scotsText.value.trim(),
      gaelicText: form.gaelicText.value.trim(),
      meaning: form.meaning.value.trim(),
      submittedBy: form.submittedBy.value.trim(),
      submittedAt: new Date().toISOString(),
    };
    if (!entry.scotsText && !entry.gaelicText) return;
    setSuggestions(s => [...s, entry]);
    form.reset();
    setToast('Thanks — saved to your suggestions. Export them any time from the Contribute panel.');
    setTimeout(() => setToast(''), 4000);
  };

  const exportSuggestions = () => {
    const blob = new Blob([JSON.stringify(suggestions, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'proverb-suggestions.json';
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="min-h-screen">
      <header className="bg-gradient-to-r from-saltire to-thistle text-white">
        <div className="max-w-4xl mx-auto px-5 py-8">
          <h1 className="text-3xl md:text-4xl font-bold proverb-text">Sean-fhaclan &amp; Auld Sayins</h1>
          <p className="mt-2 text-white/85 max-w-2xl">Search Scots proverbs and find their Scottish Gaelic equivalents — or go the other way, Gàidhlig gu Albais.</p>
        </div>
      </header>

      <main className="max-w-4xl mx-auto px-5 py-6">

        {/* Direction toggle */}
        <div className="flex flex-wrap items-center gap-3 mb-4">
          <div className="inline-flex rounded-full bg-white border border-heather/30 p-1">
            <button
              onClick={() => setDirection('scots-gaelic')}
              className={"px-4 py-1.5 rounded-full text-sm font-medium transition " + (direction === 'scots-gaelic' ? 'bg-saltire text-white' : 'text-ink/70 hover:text-ink')}
            >Scots → Gàidhlig</button>
            <button
              onClick={() => setDirection('gaelic-scots')}
              className={"px-4 py-1.5 rounded-full text-sm font-medium transition " + (direction === 'gaelic-scots' ? 'bg-thistle text-white' : 'text-ink/70 hover:text-ink')}
            >Gàidhlig → Scots</button>
          </div>

          <button onClick={randomProverb} className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-heather/30 bg-white text-sm text-ink/70 hover:text-ink">
            <DiceIcon /> Random proverb
          </button>

          <button onClick={() => setShowAbout(true)} className="ml-auto text-sm text-ink/50 hover:text-ink underline underline-offset-2">About &amp; sources</button>
        </div>

        {/* Search */}
        <input
          type="text"
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder={direction === 'scots-gaelic' ? "Search a Scots word or proverb…" : "Sireadh facal no seanfhacal Gàidhlig…"}
          className="w-full rounded-lg border border-heather/30 px-4 py-3 text-lg proverb-text focus:outline-none focus:ring-2 focus:ring-thistle/50"
        />

        {/* Filters */}
        <div className="flex flex-wrap items-center gap-3 mt-3 text-sm">
          <select value={theme} onChange={e => setTheme(e.target.value)} className="rounded-md border border-heather/30 px-2 py-1.5 bg-white">
            {themes.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <label className="inline-flex items-center gap-1.5 text-ink/70">
            <input type="checkbox" checked={onlyLinked} onChange={e => setOnlyLinked(e.target.checked)} />
            Has confirmed equivalent
          </label>
          <label className="inline-flex items-center gap-1.5 text-ink/70">
            <input type="checkbox" checked={onlyFavourites} onChange={e => setOnlyFavourites(e.target.checked)} />
            Favourites only
          </label>
          <span className="ml-auto text-ink/40">{filtered.length} result{filtered.length === 1 ? '' : 's'}</span>
        </div>

        {/* Results */}
        <div className="grid gap-4 mt-5">
          {filtered.length === 0 && (
            <p className="text-ink/50 italic py-10 text-center">Nae results. Try a different word, or clear yer filters.</p>
          )}
          {filtered.map(entry => (
            <div id={'card-' + entry.id} key={entry.id}>
              <ProverbCard entry={entry} direction={direction} favourites={favourites} toggleFavourite={toggleFavourite} />
            </div>
          ))}
        </div>

        {/* Contribute */}
        <div className="mt-10 border-t border-heather/20 pt-6">
          <button onClick={() => setShowContribute(s => !s)} className="text-thistle font-semibold hover:underline">
            {showContribute ? 'Hide' : 'Know a pairing we\'re missing? Suggest a proverb →'}
          </button>
          {showContribute && (
            <form onSubmit={handleContribute} className="mt-4 bg-white border border-heather/20 rounded-xl p-5 grid gap-3">
              <div className="grid md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs uppercase tracking-wide text-saltire font-semibold">Scots</label>
                  <input name="scotsText" className="w-full rounded-md border border-heather/30 px-3 py-2 mt-1" placeholder="Scots proverb" />
                </div>
                <div>
                  <label className="text-xs uppercase tracking-wide text-thistle font-semibold">Gàidhlig</label>
                  <input name="gaelicText" className="w-full rounded-md border border-heather/30 px-3 py-2 mt-1" placeholder="Seanfhacal Gàidhlig" />
                </div>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wide text-ink/60 font-semibold">Meaning / notes</label>
                <textarea name="meaning" rows="2" className="w-full rounded-md border border-heather/30 px-3 py-2 mt-1" placeholder="What does it mean, and where's it from?"></textarea>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wide text-ink/60 font-semibold">Your name (optional)</label>
                <input name="submittedBy" className="w-full rounded-md border border-heather/30 px-3 py-2 mt-1" placeholder="Optional" />
              </div>
              <div className="flex items-center gap-3">
                <button type="submit" className="bg-thistle text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-thistle/90">Save suggestion</button>
                {suggestions.length > 0 && (
                  <button type="button" onClick={exportSuggestions} className="text-sm text-ink/60 underline underline-offset-2">
                    Export {suggestions.length} saved suggestion{suggestions.length === 1 ? '' : 's'} as JSON
                  </button>
                )}
              </div>
              <p className="text-xs text-ink/40">Suggestions are saved in this browser only. Export them and add to the data file to make them permanent — see the README.</p>
            </form>
          )}
        </div>
      </main>

      {toast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-full shadow-lg">{toast}</div>
      )}

      {showAbout && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={() => setShowAbout(false)}>
          <div className="bg-white rounded-xl max-w-lg w-full p-6 max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <h2 className="text-xl font-bold mb-3">About this collection</h2>
            <p className="text-sm text-ink/70 mb-3">
              This is a starter set of {DATA.length} proverbs. Five pairs ({DATA.filter(d => d.linked).length} shown with a
              "confirmed equivalent" badge available via the filter) are matched by meaning across Scots and Scottish Gaelic —
              they aren't translations of one another, but traditional sayings that carry the same wisdom. The rest are
              documented proverbs in one language without a confirmed match yet in the other — genuine gaps, not errors.
            </p>
            <p className="text-sm text-ink/70 mb-3">Sources: scots-online.org (Andy Eagle); Wikiquote's Scottish Gaelic proverbs page, drawing on Alexander Nicolson's <em>A Collection of Gaelic Proverbs</em> (1882), Edward Dwelly's <em>Scottish Gaelic-English Dictionary</em> (1911), Gyula Paczolay's <em>European Proverbs in 55 Languages</em> (1997), and BBC Alba's <em>Litir do Luchd-ionnsachaidh</em>; and Lingalot's Scottish Gaelic proverbs guide.</p>
            <p className="text-sm text-ink/70">Each card's source line credits where it was drawn from. Spotted an error, or have a better-attested equivalent? Use the suggestion form.</p>
            <button onClick={() => setShowAbout(false)} className="mt-4 text-sm text-thistle underline underline-offset-2">Close</button>
          </div>
        </div>
      )}

      <footer className="text-center text-xs text-ink/40 py-8">Made for browsing, learning, and the odd argument doon the pub.</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
